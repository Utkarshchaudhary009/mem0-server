services:
  # Native Bun Runtime (Preferred for speed)
  - type: web
    name: mem0-server
    runtime: bun
    plan: free
    buildCommand: bun install
    startCommand: bun start
    envVars:
      - key: PORT
        value: 3000
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false